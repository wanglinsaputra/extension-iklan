<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Overlay pass-through test</title>
<style>
  body { font-family: sans-serif; }
  #play { padding: 20px 40px; font-size: 20px; }
  #overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0); z-index: 99999; }
  #log { margin-top: 20px; white-space: pre; font-weight: bold; }
</style>
</head>
<body>
<button id="play">PLAY (target asli di bawah overlay)</button>
<div id="overlay"></div>
<pre id="log">Status: belum dites.\n\nCara: klik sembarang titik di tengah layar.\n- Tanpa extension: FAIL (klik kena overlay)\n- Dengan extension aktif: PASS (klik tembus ke tombol play)</pre>
<script>
  document.getElementById('overlay').addEventListener('click', () => {
    document.getElementById('log').textContent =
      'FAIL: klik kena overlay (extension mati / gagal).';
  });
  document.getElementById('play').addEventListener('click', () => {
    document.getElementById('log').textContent =
      'PASS: klik tembus overlay, tombol play ketemu.';
  });
</script>
</body>
</html>
